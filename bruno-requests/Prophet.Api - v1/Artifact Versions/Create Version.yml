info:
  name: Create Version
  type: http
  seq: 2000
  tags:
    - Artifact Versions

http:
  method: POST
  url: "{{baseUrl}}/v1/prophet/projects/{{projectId}}/versions"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "parentVersionId": null,
        "changeSummary": "Initial version"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200 or 404", () => {
          expect(res.getStatus()).to.be.oneOf([200, 404]);
        });
        if (res.getStatus() === 200) {
          const json = res.getBody();
          test("Response has success flag", () => {
            expect(json.success).to.be.true;
          });
          test("Response data has id", () => {
            expect(json.data).to.have.property("id");
            expect(json.data.id).to.be.a("string").and.not.empty;
          });
          if (json.data && json.data.id) {
            bru.setVar("versionId", json.data.id);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Optional `parentVersionId` (GUID) and `changeSummary` (string). On success stores `versionId` for use in Pipeline requests.
