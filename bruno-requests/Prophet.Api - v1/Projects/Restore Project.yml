info:
  name: Restore Project
  type: http
  seq: 6000
  tags:
    - Projects

http:
  method: PATCH
  url: "{{baseUrl}}/v1/prophet/projects/{{projectId}}/restore"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200 or 404", () => {
          expect(res.getStatus()).to.be.oneOf([200, 400, 404]);
        });
        if (res.getStatus() === 200) {
          const json = res.getBody();
          test("Response has success flag", () => {
            expect(json.success).to.be.true;
          });
          test("Response data has id", () => {
            expect(json.data).to.have.property("id");
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Restores a soft-deleted project (clears deletion timestamp). Returns 404 if the project does not exist or was never deleted.
