info:
  name: Get Pipeline Status
  type: http
  seq: 2000
  tags:
    - Pipeline

http:
  method: GET
  url: "{{baseUrl}}/v1/prophet/projects/{{projectId}}/versions/{{versionId}}/status"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200 or 404", () => {
          expect(res.getStatus()).to.be.oneOf([200, 404]);
        });
        if (res.getStatus() === 200) {
          const json = res.getBody();
          test("Response has success flag", () => {
            expect(json.success).to.be.true;
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Returns current pipeline run status for the version. Poll this after Run Pipeline to track step progress.
